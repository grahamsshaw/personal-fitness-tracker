{% extends "base.html" %}

{% block title %}New Exercise - Fitness Tracker{% endblock %}

{% block content %}
<h1>New Exercise</h1>
<p class="text-muted">A name and a body part is enough — it behaves like built-in exercises everywhere (runner, plans, muscle map).</p>

<form method="POST" class="form">
    <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Cable fly">
    </div>
    <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category">
            <option value="strength">Strength</option>
            <option value="cardio">Cardio</option>
            <option value="flexibility">Flexibility</option>
            <option value="balance">Balance</option>
        </select>
    </div>
    <div class="form-group">
        <label for="muscle_group">Body part / muscle group</label>
        <input type="text" id="muscle_group" name="muscle_group" placeholder="e.g. chest">
    </div>
    <div class="form-group">
        <label for="target_muscle">Target muscle (optional)</label>
        <input type="text" id="target_muscle" name="target_muscle" placeholder="e.g. pectorals">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add exercise</button>
        <a href="{{ url_for('equipment.exercise_library') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
